mainprefix = "zrn"     # Ideally, replace "zrn" across the whole repo with your mod's mainprefix, example "t" (without the "")
prefix = "storm"             # Ideally, replace "storm" across the whole repo with your mod's prefix, example "mod" (without the "")

name = "STORM Framework"

[properties]
author = "OverlordZorn [CVO]"
url = "https://github.com/CVO-Org/STORM-Framework"

[binarize]
# enabled = true # Default: true

[files]
include = [         # mod.cpp, meta.cpp, LICENSE, logo_ca.paa and logo_co.paa are copied by default
    "/img/*.paa",
    "*.bikey",
]
exclude = [
    "*.psd",        # By default this list is empty
    "*.md",
]

[version]
# path = "addons/main/script_version.hpp" # Default
# major = 0 # Overrides path when set
# minor = 1
# patch = 1
git_hash = 0 # Default: 8
